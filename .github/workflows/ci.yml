name: CI

on:
  push:
  pull_request:

jobs:
  # Testes e verificações rodam na imagem dev (mesma do desenvolvimento).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target dev -t map-relations-dev .
      - run: docker run --rm map-relations-dev uv run ruff check .
      - run: docker run --rm map-relations-dev uv run mypy research tests scripts
      - run: docker run --rm map-relations-dev uv run python -m scripts.generate_schemas --check
      - run: docker run --rm map-relations-dev uv run pytest

  # Garante que a imagem de execução (sem ferramentas de dev) continua construível.
  build-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t map-relations-prod .
      - run: docker run --rm map-relations-prod python -c "import research.map_relations.core.models"
