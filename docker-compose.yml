services:
  app:
    build:
      context: .
      target: dev
    # Docker Desktop para Linux mapeia root do contêiner → usuário do host (ver ADR 002).
    # Fora do Desktop (CI, deploy) a imagem usa appuser (UID 1000) por padrão.
    user: "0:0"
    volumes:
      - ./research:/app/research
      - ./tests:/app/tests
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - ./eval:/app/eval
      - ./data:/app/data
    env_file:
      - path: .env
        required: false

  painel:
    build:
      context: .
      target: dev
    user: "0:0"
    command: uv run uvicorn research.map_relations.painel.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./research:/app/research
      - ./eval:/app/eval
      - ./data:/app/data
    env_file:
      - path: .env
        required: false

  docling:
    # Placeholder — DoclingParser para conversão de PDF (implementar em B04b)
    image: busybox
    command: ["echo", "docling service: implementar em B04b"]
    profiles:
      - docling
