services:
  app:
    image: maprelations-app
    build:
      context: .
      target: dev
    # Docker Desktop para Linux mapeia root do contêiner → usuário do host (ver ADR 002).
    # Fora do Desktop (CI, deploy) a imagem usa appuser (UID 1000) por padrão.
    user: "0:0"
    volumes:
      - ./research:/app/research
      - ./tests:/app/tests
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - ./eval:/app/eval
      - ./data:/app/data
      # config viva no contêiner (ruff/mypy/pytest); para travar deps use
      # uv lock montando o diretório (ver ADR 007)
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      # lidos por tests/test_ci_sync.py (make ci × ci.yml)
      - ./Makefile:/app/Makefile:ro
      - ./.github:/app/.github:ro
      # lidos por tests/test_mlflow_config.py (porta, volume e Git ignorados)
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.gitignore:/app/.gitignore:ro
      - ./.dockerignore:/app/.dockerignore:ro
    environment:
      # eval --track: só endereço da máquina; o padrão é o serviço mlflow (make mlflow)
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    env_file:
      - path: .env
        required: false

  painel:
    # Mesma imagem do app (B04f): sem build próprio, para nunca divergir.
    # Exige `docker compose build app` (ou qualquer alvo do Makefile que
    # rode `app`) antes do primeiro `docker compose up painel`.
    image: maprelations-app
    user: "0:0"
    command: uv run uvicorn map_relations.painel.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./research:/app/research
      - ./eval:/app/eval
      - ./data:/app/data
    env_file:
      - path: .env
        required: false

  docling:
    # Conversão estruturada de PDF (prova do B04b). Imagem pesada: só sobe
    # com --profile docling; nunca no CI.
    build:
      context: .
      dockerfile: docker/docling/Dockerfile
    user: "0:0"
    volumes:
      - ./data:/data
    profiles:
      - docling

  mineru:
    # Reconhecimento do MinerU Basic (B04d fase 6, B.3) — rodou uma vez para
    # o ADR; sem adaptador. Imagem própria, só sobe com --profile mineru;
    # nunca no CI.
    build:
      context: .
      dockerfile: docker/mineru/Dockerfile
    user: "0:0"
    volumes:
      - ./data:/data
      - mineru_models:/root/.mineru
    profiles:
      - mineru

  mlflow:
    # Rastreamento das avaliações (B02 §8, ADR 013). Só com --profile mlflow;
    # nunca no CI. Publicado apenas em 127.0.0.1:5010. Versão igual à do
    # mlflow-skinny do grupo dev (pyproject.toml). Dados em ./mlflow_data/ (fora do Git).
    image: ghcr.io/mlflow/mlflow:v3.18.0
    user: "0:0"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow:5000,localhost:5010,127.0.0.1:5010"
    ports:
      - "127.0.0.1:5010:5000"
    volumes:
      - ./mlflow_data:/mlflow
    profiles:
      - mlflow

volumes:
  mineru_models: {}
