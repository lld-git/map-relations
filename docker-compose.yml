services:
  app:
    build:
      context: .
      target: dev
    # Docker Desktop para Linux mapeia root do contêiner → usuário do host (ver ADR 002).
    # Fora do Desktop (CI, deploy) a imagem usa appuser (UID 1000) por padrão.
    user: "0:0"
    volumes:
      - ./research:/app/research
      - ./tests:/app/tests
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - ./eval:/app/eval
      - ./data:/app/data
      # config viva no contêiner (ruff/mypy/pytest); para travar deps use
      # uv lock montando o diretório (ver ADR 007)
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    env_file:
      - path: .env
        required: false

  painel:
    build:
      context: .
      target: dev
    user: "0:0"
    command: uv run uvicorn map_relations.painel.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./research:/app/research
      - ./eval:/app/eval
      - ./data:/app/data
    env_file:
      - path: .env
        required: false

  docling:
    # Conversão estruturada de PDF (prova do B04b). Imagem pesada: só sobe
    # com --profile docling; nunca no CI.
    build:
      context: .
      dockerfile: docker/docling/Dockerfile
    user: "0:0"
    volumes:
      - ./data:/data
    profiles:
      - docling

  mineru:
    # Reconhecimento do MinerU Basic (B04d fase 6, B.3) — rodou uma vez para
    # o ADR; sem adaptador. Imagem própria, só sobe com --profile mineru;
    # nunca no CI.
    build:
      context: .
      dockerfile: docker/mineru/Dockerfile
    user: "0:0"
    volumes:
      - ./data:/data
      - mineru_models:/root/.mineru
    profiles:
      - mineru

volumes:
  mineru_models: {}
