[project]
name = "map-relations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "spacy>=3.7",
    "pt-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
    "rapidfuzz>=3.9",
    "networkx>=3.3",
    "httpx>=0.27",
    "pypdf>=4.3",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pydantic>=2.9",
    "pydeps>=1.12",
    "vulture>=2.11",
    "types-PyYAML>=6.0",
    # só para o teste de exaustividade do mapa de rótulos do Docling
    # (B04d B.2); o serviço docling roda isolado, com a imagem própria.
    # Versão fixa, igual à do serviço docling (docker/docling/Dockerfile) —
    # docling==2.150.0 pede docling-core>=2.106.0,<3.0.0 (faixa, sem lock);
    # 2.107.1 é a versão mais recente da faixa hoje nos dois lugares.
    "docling-core==2.107.1",
    # cliente do RunTracker (B02 §8, ADR 013); mesma versão do servidor no compose.
    "mlflow-skinny==3.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# o pacote vive em research/ mas instala como map_relations (ADR 007)
packages = ["research/map_relations"]

[tool.hatch.metadata]
# o modelo spaCy é dependência por URL (ver B00b)
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_spacy_model: needs pt_core_news_sm downloaded (skipped in CI)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["golden_scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["map_relations", "scripts"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["^golden_scripts/", "^docs/mapa/vulture_whitelist\\.py$"]
